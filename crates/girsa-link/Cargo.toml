[package]
name = "girsa-link"
description = "The typed link graph, repair overrides, and later link mining"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# A command line and a sentence, and nothing about a corpus. The leaf.
girsa-plain.workspace = true
girsa-corpus.workspace = true
girsa-ref.workspace = true
# Your judgments about the shipped graph are your own layer, written in the one
# format the rest of it is — appended to, not rewritten per confirmed link.
girsa-personal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The acceptance test compares two Hebrew strings — one menukad, one bare — and
# W2's sibling rule is that every such comparison routes through this crate.
girsa-hebrew.workspace = true
# A graph to assert against. `links` because these tests are about edges, and a
# fixture shelf with no edges on it would let them all pass having found nothing
# — which is what they did for the whole of their existence before this.
girsa-fixture = { workspace = true, features = ["links"] }

[lints]
workspace = true
