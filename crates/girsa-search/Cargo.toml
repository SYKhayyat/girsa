[package]
name = "girsa-search"
description = "tantivy indices, the five search modes, and the relaxation ladder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# A command line and a sentence, and nothing about a corpus. The leaf.
girsa-plain.workspace = true
girsa-corpus.workspace = true
girsa-hebrew.workspace = true
# The link graph, for spec.md §9.8's link-type facet. A result row's facets
# are read off the index, and the column they are read from is written from
# `girsa_link::touching` at build time.
girsa-link.workspace = true
# The OCR queue (W21). The finding and the ranking are `girsa-fix`'s, because
# they are about corrections; the term dictionary they read is this crate's,
# and `girsa-suspects` is the thin batch job between them.
girsa-fix.workspace = true
# Your own layer against the index (B7). A note written since the last build is
# absent from the results and nothing said so, and the sentence that says it has
# to be the same sentence the window shows — so it lives in `girsa-note`, under
# both callers, rather than being written twice. `girsa-app` cannot own it:
# `gap_over` takes a slice of slugs rather than a `Scope` specifically so this
# crate need not be a dependency of it, and that call is written down.
girsa-note.workspace = true
girsa-ref.workspace = true
# Scans (spec.md §9.7, W26). One index, two location types: what is on a page
# of a PDF is read in `girsa-scan` and indexed here, and a result row says which
# of the two it is.
girsa-scan.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The index. Chosen for what spec.md §9 needs and nothing more: positions (so a
# phrase and a proximity are askable), a pluggable tokenizer (so the index is
# built by the *same* normalizer the query bar uses — W2's whole point), and an
# embedded segment store, because offline is the product (spec.md §14) and a
# search server is not something a reader should have to run.
tantivy = "0.26"
# The automaton `AutomatonWeight` walks the term dictionary with, so a
# `contains`/`letters` form inside a proximity can be expanded to the terms it
# matches. Pinned to the same minor tantivy itself uses (0.5), so the two
# automata can never disagree about what a regex means.
tantivy-fst = "0.5"

[dev-dependencies]
# The synthetic shelf, so a test about *which place a citation lands on* has a
# real schema, a real lexicon and real segments to land on — built through the
# real importer rather than hand-written. The dependency points back at this
# crate through the fixture's optional `search` feature, which is off here;
# cargo permits the cycle for a dev-dependency either way, and `girsa-corpus`
# already carries the same one for the same reason.
girsa-fixture.workspace = true

[lints]
workspace = true
