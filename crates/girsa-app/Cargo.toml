[package]
name = "girsa-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The reading workspace — shelf, panes, and what keeps two columns together"

[dependencies]
# A command line and a sentence, and nothing about a corpus. The leaf.
girsa-plain.workspace = true
girsa-corpus.workspace = true
girsa-ref.workspace = true
girsa-hebrew.workspace = true
girsa-link.workspace = true
# Corrections are an overlay and never an edit (spec.md §7, W20). The reading
# pane applies them the moment a sefer is opened, so everything downstream —
# the page, a quote, a citation regenerated from a ref — is the sefer as you
# have it.
girsa-fix.workspace = true
# Your own layer (spec.md §11, W27): notes, marks, saved queries and chaburah
# folders. It is a crate rather than a module here because a note is joined to
# the corpus by a `girsa_link::Edge` and put on the shelf as a `Work` — the
# workspace is the thing that *shows* your layer, not the thing that defines it.
girsa-note.workspace = true
girsa-personal.workspace = true
# Scans you brought (spec.md §6.3, W25). Which page is which daf is arithmetic
# on a declaration, and it is kept out of here so it can be tested without a
# shelf — and so W26's OCR has somewhere to go that is not the workspace.
girsa-scan.workspace = true
# The Ksav loop (spec.md §10). The packet is the contract and the formatter is
# the one both applications compile — neither is reimplemented here.
girsa-cite.workspace = true
girsa-source.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# `girsa_app::pretend`: a sefer in memory to test a quote against. Off by
# default so a reader's build never compiles it, and on in the
# `[dev-dependencies]` of the crates above this one — which is how the two Ksav
# tests that need this sefer stayed one fixture instead of two.
pretend = []

[dev-dependencies]
# Ksav is `girsa-desk`'s dependency now, and it is here for exactly one
# assertion: that the packet a scan produces — no text, a daf for an address —
# comes out of the writer as a *mareh makom* and not as an empty quote block.
# The library does not compile a document format; the acceptance test still
# checks that what it hands over survives one.
girsa-ksav.workspace = true
# And here for exactly one more: that every refusal `girsa-post` can make has a
# Hebrew sentence waiting for it in `app/src/trouble.ts`. The window compiles no
# loopback — the Tauri shell does — but the sentences a reader is shown are this
# workspace's business, and `PostError::CODES` is the only thing that knows what
# the list is. Nothing a reader runs compiles this.
girsa-post.workspace = true
# A shelf with a link graph on it, so the fifteen acceptance tests in `tests/`
# and the seven in `mefarshim.rs` assert something on a fresh clone instead of
# printing `ok` in 0.00s. `links` because every one of them is about what lands
# on a line.
girsa-fixture = { workspace = true, features = ["links"] }
# W25's test drops a real scan on a real shelf, so it writes a real PDF rather
# than checking in a binary nobody can diff — the same way `girsa-corpus` tests
# the importer that reads it.
lopdf = { version = "0.42.0", default-features = false }

[lints]
workspace = true
