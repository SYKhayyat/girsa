[package]
name = "girsa-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The reading workspace — shelf, panes, and what keeps two columns together"

[dependencies]
girsa-corpus.workspace = true
girsa-ref.workspace = true
girsa-hebrew.workspace = true
girsa-link.workspace = true
# Corrections are an overlay and never an edit (spec.md §7, W20). The reading
# pane applies them the moment a sefer is opened, so everything downstream —
# the page, a quote, a citation regenerated from a ref — is the sefer as you
# have it.
girsa-fix.workspace = true
# The Ksav loop (spec.md §10). The packet is the contract and the formatter is
# the one both applications compile — neither is reimplemented here.
girsa-cite.workspace = true
# The buffer writes real Ksav markup from the first keystroke (spec.md §10.3),
# which means the same writer Ksav compiles and not a second one here.
girsa-ksav.workspace = true
girsa-source.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
