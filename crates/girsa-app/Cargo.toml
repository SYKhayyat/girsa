[package]
name = "girsa-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The reading workspace — shelf, panes, and what keeps two columns together"

[dependencies]
girsa-corpus.workspace = true
girsa-ref.workspace = true
girsa-hebrew.workspace = true
girsa-link.workspace = true
# Corrections are an overlay and never an edit (spec.md §7, W20). The reading
# pane applies them the moment a sefer is opened, so everything downstream —
# the page, a quote, a citation regenerated from a ref — is the sefer as you
# have it.
girsa-fix.workspace = true
# Your own layer (spec.md §11, W27): notes, marks, saved queries and chaburah
# folders. It is a crate rather than a module here because a note is joined to
# the corpus by a `girsa_link::Edge` and put on the shelf as a `Work` — the
# workspace is the thing that *shows* your layer, not the thing that defines it.
girsa-note.workspace = true
# Scans you brought (spec.md §6.3, W25). Which page is which daf is arithmetic
# on a declaration, and it is kept out of here so it can be tested without a
# shelf — and so W26's OCR has somewhere to go that is not the workspace.
girsa-scan.workspace = true
# The Ksav loop (spec.md §10). The packet is the contract and the formatter is
# the one both applications compile — neither is reimplemented here.
girsa-cite.workspace = true
# The buffer writes real Ksav markup from the first keystroke (spec.md §10.3),
# which means the same writer Ksav compiles and not a second one here.
girsa-ksav.workspace = true
girsa-source.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Exporting a corrected sefer (spec.md §7.4, W22). A .docx is a zip with an XML
# part in it, and `girsa-corpus` already opens them to read a Word file you
# dropped on the window; writing one is the same two files backwards. MIT, and
# with its default features off.
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# W25's test drops a real scan on a real shelf, so it writes a real PDF rather
# than checking in a binary nobody can diff — the same way `girsa-corpus` tests
# the importer that reads it.
lopdf = { version = "0.42.0", default-features = false }

[lints]
workspace = true
