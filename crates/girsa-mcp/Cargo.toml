[package]
name = "girsa-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The library, answering a program instead of a person — MCP over stdio"

[dependencies]
# The shelf, and the text a segment id names.
girsa-app.workspace = true
# `Adjacency` and `Unseen`: the lane's answers, and the one composer of what an
# answer could not see.
girsa-nearby.workspace = true
girsa-corpus.workspace = true
# The five modes and the relaxation ladder. The whole point of this crate is
# that a program gets the *same* engine a person does, including its refusals —
# so the modes are this crate's dependency and not its reimplementation.
# Your own layer, for the tag facet (B18): a tag is a property of a note, and
# `Catalogue::tagged` is given the notes as this crate read them.
girsa-note.workspace = true
girsa-search.workspace = true
# The graph, and W28's chain tracing over it.
girsa-link.workspace = true
# The semantic lane (spec.md §9.9, W30), for its `State` — the `adjacent` tool
# has to tell a caller whether the lane is off, adrift or running, in the same
# words the window uses.
girsa-lane.workspace = true
girsa-ref.workspace = true
# Two Hebrew strings are compared in `seforim`, and W2's sibling rule is that
# every such comparison in this codebase goes through the shared normalizer.
girsa-hebrew.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# A shelf, a graph and an index over both — everything `Server::open` takes. The
# eight tests in `tests/` needed all three present and printed `ok` in 0.00s
# whenever they were not, which on a fresh clone is always.
girsa-fixture = { workspace = true, features = ["index"] }

[lints]
workspace = true
