[package]
name = "girsa-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Handing somebody a sefer with your corrections in it — a clean .txt or .docx"

[dependencies]
# The sefer as you are reading it: corrected, with the inline markup already
# turned into something a reader sees. This crate writes that down and decides
# nothing about what it says.
girsa-app.workspace = true
girsa-corpus.workspace = true
girsa-fix.workspace = true
thiserror.workspace = true

# A .docx is a zip with an XML part in it.
#
# This line used to claim to be "the only dependency in the tree that is here
# for a file format nobody reads back, which is the whole argument for the
# crate". Measured on 9 August 2026 and it is not true: `girsa-corpus` carries
# the same `zip 7.2.0` — it opens a .docx you drop on the window, which this
# crate's own header says three lines in — and `cargo tree -e normal` puts this
# crate at **one crate over girsa-app: itself**.
#
# So the isolation argument is zero and the crate stays anyway, on the argument
# that was always the real one: writing a file format nobody reads back is a
# different subject from reading a shelf, and `girsa-export` is where that
# subject lives. A boundary can be worth having without saving a compile.
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The acceptance test writes a shelf's `works/index.jsonl` by hand.
serde_json.workspace = true

[lints]
workspace = true
