[package]
name = "girsa-corpus"
description = "Storage, ingest, schemas, and permanent segment IDs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
girsa-ref.workspace = true
girsa-hebrew.workspace = true
# Your own writing goes on the shelf (spec.md §10.4), and reading a `.ksav`
# document is the same crate that wrote it.
girsa-ksav.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The only network dependency in the project, and it exists for one sanctioned
# use: pulling the corpus (spec.md §14 — offline is the product). rustls rather
# than the system TLS stack, so a build needs no OpenSSL on any of the three
# platforms. MIT OR Apache-2.0.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Your own material (spec.md §5). A .docx is a zip with an XML part in it, and
# a PDF's page count cannot be counted by looking — a modern one keeps its page
# tree inside a compressed object stream. Both MIT, both with their default
# features off: nothing here encrypts, renders or rasterizes anything.
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
lopdf = { version = "0.42.0", default-features = false }

[dev-dependencies]
# The fixtures for those two: an integration test writes a real .docx and a
# real .pdf rather than checking in binaries nobody can diff.
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
lopdf = { version = "0.42.0", default-features = false }
# A shelf to assert against, so `spec_counts` runs on a fresh clone instead of
# printing `ok` in 0.00s having checked nothing. The dependency points back at
# this crate, which cargo permits for a dev-dependency and which is the honest
# shape: the fixture is built *by* this importer.
girsa-fixture.workspace = true

[lints]
workspace = true
