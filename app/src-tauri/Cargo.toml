[package]
name = "girsa-shell"
version = "0.1.1"
description = "Girsa — a Torah library that assumes you are going to write something"
authors = ["Shaul Khayyat"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/girsa"
edition = "2021"
rust-version = "1.85"

[lib]
name = "girsa_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the window read **one** directory of the
# reader's own disk: `personal/files`, where a dropped PDF was copied to. A scan
# is tens or hundreds of megabytes and cannot sensibly travel over the IPC
# channel, and the scope is opened at startup on that one directory rather than
# in the config, because the personal root is `GIRSA_PERSONAL` and is not known
# until then. Nothing else on the disk is reachable. (spec.md §6.3, W25.)
tauri = { version = "2", features = ["protocol-asset"] }
serde = { workspace = true }
serde_json = { workspace = true }

# The workspace one directory up. Everything this crate does beyond opening a
# window is in there, where it can be tested without a webview.
#
# `workspace = true` throughout: this crate is a member of that workspace now
# (see the `default-members` note in the root manifest), so the version and the
# path are stated once. The `=0.5.0` pins on the sefer-crates half in particular
# used to be spelled here as bare paths with no version at all — which is to say
# the pin whose whole job is to make a bump deliberate did not apply to the one
# crate that owns the interop.
girsa-app = { workspace = true }
# Handing somebody a corrected sefer (spec.md §7.4, W22). Its own crate because
# a .docx is a zip and the reading workspace has no use for one; the window
# names a format and a path and decides nothing about what comes out.
girsa-export = { workspace = true }
# The desk (spec.md §10): the buffer you type into, what a highlighted phrase
# becomes, and which of your documents cite a place. Ksav is the only thing in
# the tree that speaks a document format, and it stops here.
girsa-desk = { workspace = true }
# What else is near this, and what an answer could not see (spec.md §9.9, W30).
# The window draws the coverage sentence this crate composes and decides
# nothing about it.
girsa-nearby = { workspace = true }
girsa-corpus = { workspace = true }
# Corrections: an overlay of patches on permanent ids, never an edit to the
# shipped text (spec.md §7). The window shows what it says and decides nothing.
girsa-fix = { workspace = true }
# The link graph and your repairs to it (spec.md §8.3). The window shows what
# this crate says about an edge and judges nothing itself.
girsa-link = { workspace = true }
# Your own layer: notes, marks, saved queries, folders (spec.md §11). A note's
# connection to a sugya is a link like any other, so the window has no separate
# panel for it — see the W27 section at the foot of `lib.rs`.
girsa-note = { workspace = true }
# The search bar: five modes, three chips, five facets (spec.md §9). The window
# draws what this crate decides and decides nothing itself.
girsa-search = { workspace = true }
# Scans (spec.md §6.3). Which page is which daf is decided here and drawn
# there; the window opens the PDF and knows nothing about dafim.
girsa-scan = { workspace = true }
# The semantic lane (spec.md §9.9, W30). Off in a fresh install, and off costs
# nothing: no model is loaded and no vector is read. The window draws the
# coverage sentence this crate composes and decides nothing about it.
girsa-lane = { workspace = true }
girsa-ref = { workspace = true }
# The Ksav loop: the packet is the contract and the formatter is shared
# (spec.md §10.1). Neither is reimplemented here.
girsa-cite = { workspace = true }
girsa-source = { workspace = true }
# The loopback: token-gated, localhost only, and the `girsa://` links.
girsa-post = { workspace = true }
girsa-ksav = { workspace = true }
clipboard-rs = { version = "0.3.5", default-features = false }
tauri-plugin-deep-link = "2.4.9"

# One native dialog: *choose the directory your model is in* (W30). It is here
# rather than a text field because the default way to use the semantic lane is to
# point it at weights you already have, and asking a reader to type an absolute
# path is asking them not to bother. It grants an open-dialog and nothing else —
# no filesystem plugin, and the chosen path still goes through the commands in
# this file.
tauri-plugin-dialog = "2"

# Inherited, at last.
#
# These used to be three lints copied out of the root manifest by hand, because
# an `exclude`d crate cannot see `[workspace.lints]`. The copy held — one
# `expect` in 4,080 lines — but that was discipline, not enforcement, and a
# fourth lint added to the workspace would have missed the 5,018 lines that own
# every byte of the interop. A panic here takes the reader's window with it.
[lints]
workspace = true

# The half of the deep link that was missing, and the half a reader meets.
#
# Measured on the release build with Girsa already open: firing
# `girsa:bavli/shabbat/12b:3#242` started a **second copy of the application**
# and left the open window exactly where it was. So the reverse direction of the
# Ksav loop — click a citation in your Word document, land on the daf — opens a
# duplicate instead, and two instances then write the same `session.json`, which
# is last-writer-wins on the reader's whole workspace.
#
# On Windows and Linux the deep-link plugin only reaches a *cold* start on its
# own; delivering a URL to a running process is this plugin's job, and its
# `deep-link` feature hands the argv straight to the listener already wired in
# `run()`. It is documented as deep-link's companion on these platforms and was
# simply never added. macOS routes URLs through the app delegate and needs
# neither, which is why this is a targeted dependency.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
