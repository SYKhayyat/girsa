name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `SEFER_CRATES_REF` used to live here, and the checkouts that used it are
  # gone with it.
  #
  # The history is worth keeping because it is the argument for what replaced
  # it. The shared crates were `path = "../sefer-crates/crates/…"`, a sibling of
  # this checkout's root, so every job carried a second `actions/checkout` purely
  # to fake the desk layout — and for a while that checkout had no `ref:` at all,
  # which undid the version pin entirely: CI resolved `=0.5.0` against whatever
  # sefer-crates `main` happened to be at that second. **Three of this
  # repository's eleven CI runs died on it**, fifteen seconds in (run
  # 30673098247, `failed to select a version for the requirement girsa-hebrew =
  # "=0.5.0"`). 27% of CI history red because a different repository's default
  # branch had not caught up.
  #
  # `ref:` fixed the symptom. The cause was that a *manifest* named a directory
  # outside the repository, which also meant `git clone girsa && cargo build`
  # failed at `cargo metadata` with os error 3, before a compiler ran, naming a
  # directory the reader had never heard of. The rev is in `Cargo.toml` now — see
  # the note above the girsa dependencies there — so cargo fetches the pinned
  # commit itself and there is nothing here to keep in step.

# A push that supersedes another push should not make the machine finish the
# first one. Pushes currently stack, and every superseded run pays a full
# compile of tantivy and candle before anyone reads its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Girsa

      # The pen. Not built here — only its fixture is read, by the last step.
      #
      # Deliberately **not** pinned, unlike the shared crates. This step exists
      # to catch drift between what Girsa produces and what Ksav asserts on, and
      # a pinned Ksav would be a drift check against a frozen consumer, which is
      # no drift check at all. The shared crates are pinned because taking a new
      # version has to be a deliberate act; this is the opposite question.
      - uses: actions/checkout@v4
        with:
          repository: SYKhayyat/ksav
          path: Ksav

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Girsa

      - run: cargo build --all-targets
        working-directory: Girsa

      # This used to be forty-three test functions quieter than it looked.
      #
      # They gated on the 3.4 GB corpus and `return`ed when it was absent, which
      # here is always — so CI printed `ok` in 0.00s for the acceptance tests of
      # W7, W8, W9, W10, W27, W28, W32, W43 and W44, and for the MCP surface
      # entire. `spec_counts.rs`, the file that would have caught §3's ids being
      # renumbered by every re-import, had not run since the day it was written.
      #
      # `girsa-fixture` builds a shelf from `merged.json` files and a
      # `links0.csv` through the real importer in about a second, and they all
      # run on it now. What genuinely needs the download — *697 simanim of 4,171
      # se'ifim*, the named mefarshim of a Sefaria release — is `#[ignore]`d
      # rather than skipped, so it reads as `10 ignored` here instead of ten
      # green ticks. On a machine with a corpus: `cargo test -- --ignored`.
      - run: cargo test
        working-directory: Girsa
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: Girsa
      - run: cargo fmt -- --check
        working-directory: Girsa

      # The producer against the consumer, on every push.
      #
      # `Ksav/ksav/engine/tests/from_girsa.rs` asserts a Ksav page against a
      # packet Girsa really produced. That fixture was captured by hand, because
      # reproducing it needed the 2.2 GB corpus — so when the import path
      # started dropping the printed edition, the fixture kept the old value and
      # the one test that existed to catch it went green for the whole time it
      # was broken. `--example fixture-packet` needs no corpus, so this is now a
      # `cargo run` and a `diff`. See tools/check-ksav-fixture.sh.
      - name: Girsa's packet is still the one Ksav asserts against
        run: bash tools/check-ksav-fixture.sh
        working-directory: Girsa

      # The other generated artifact, and it had no gate.
      #
      # The README says the shortcut card is "generated from the source, so it
      # cannot drift." It is generated; nothing checked that anybody had
      # re-generated it. Same script shape as the line above, for the same
      # reason — the repository invented generate-and-diff for the *other*
      # application's fixture and did not apply it to its own card.
      - name: The shortcut card is still what girsa-card prints
        run: bash tools/check-card.sh
        working-directory: Girsa

  # The window, which is where the whole Girsa half of the Ksav loop lives:
  # 5,018 lines and all 100 tauri commands.
  #
  # `app/src-tauri` cannot compile until the frontend has been built into
  # `app/dist`, and root `cargo build --all-targets` has to stay green without a
  # node toolchain. That constraint is real and it is now expressed as
  # `default-members` in the root manifest rather than as `exclude` — so the
  # shell is a workspace member that is simply not built by default, and it
  # inherits `[workspace.lints]` and `[workspace.dependencies]` like everything
  # else. What this job still owes is the *ordering*: build the frontend first,
  # then check the crate.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Girsa
      # What `tauri` links against on Linux. The webview is the platform's,
      # which is the reason spec.md asks for Hebrew-with-nikud to be looked at
      # on both platforms rather than screenshotted on one.
      #
      # `libappindicator3-dev` is deliberately absent. It and
      # `libayatana-appindicator3-dev` conflict — the ayatana package
      # `Replaces:` the old one, so asking for both makes apt exit 100 and the
      # job never reaches a compiler. Tauri v2 wants ayatana. Ksav's workflow
      # carries this same note, having learned it first; this file asked for
      # both anyway on its first run, and got the 100.
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Girsa/app/package-lock.json
      - run: npm ci
        working-directory: Girsa/app

      # The window's own tests, which ran when he remembered.
      #
      # `package.json` has defined `test` since the runner was written and no
      # gate has ever called it. Seven test files, and among them
      # `sources.test.mjs`, which the 31 July report called *"the entire
      # argument for that shape of test"* after it caught a raw `<select>` in
      # code written a week after the guard. It caught that because somebody ran
      # it by hand.
      #
      # This is GRADE finding N-3 — *"the gates were built and then never
      # switched on"* — recurring one layer down, three days after N-3 was
      # closed. Before `npm run build`, because a type error should not have to
      # wait behind a bundle.
      - run: npm test
        working-directory: Girsa/app

      # `app/dist`, which the crate below embeds and cannot compile without.
      - run: npm run build
        working-directory: Girsa/app

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # One workspace now, so one cache — the same key the library job saves
      # under. This job used to key on `Girsa/app/src-tauri` and rebuild
      # tantivy, candle and all nine crates a second time: 27m48s against the
      # library job's 2m44s on a cold cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Girsa

      # `check` rather than `build`: what this gate is for is the refactor in a
      # shared crate that breaks a caller nothing compiles. That shows up here.
      # Run from `app/src-tauri` so cargo selects the shell out of the workspace
      # — the root default members deliberately leave it out.
      - run: cargo check --all-targets
        working-directory: Girsa/app/src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: Girsa/app/src-tauri
      - run: cargo fmt -- --check
        working-directory: Girsa/app/src-tauri
