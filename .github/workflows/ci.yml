name: ci

on:
  push:
  pull_request:
  # So the installer can be built without cutting a tag — see the `bundle` job,
  # which is the only thing that reads this.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `SEFER_CRATES_REF` used to live here, and the checkouts that used it are
  # gone with it.
  #
  # The history is worth keeping because it is the argument for what replaced
  # it. The shared crates were `path = "../sefer-crates/crates/…"`, a sibling of
  # this checkout's root, so every job carried a second `actions/checkout` purely
  # to fake the desk layout — and for a while that checkout had no `ref:` at all,
  # which undid the version pin entirely: CI resolved `=0.5.0` against whatever
  # sefer-crates `main` happened to be at that second. **Three of this
  # repository's eleven CI runs died on it**, fifteen seconds in (run
  # 30673098247, `failed to select a version for the requirement girsa-hebrew =
  # "=0.5.0"`). 27% of CI history red because a different repository's default
  # branch had not caught up.
  #
  # `ref:` fixed the symptom. The cause was that a *manifest* named a directory
  # outside the repository, which also meant `git clone girsa && cargo build`
  # failed at `cargo metadata` with os error 3, before a compiler ran, naming a
  # directory the reader had never heard of. The rev is in `Cargo.toml` now — see
  # the note above the girsa dependencies there — so cargo fetches the pinned
  # commit itself and there is nothing here to keep in step.

# A push that supersedes another push should not make the machine finish the
# first one. Pushes currently stack, and every superseded run pays a full
# compile of tantivy and candle before anyone reads its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Girsa

      # The pen. Not built here — only its fixture is read, by the last step.
      #
      # Deliberately **not** pinned, unlike the shared crates. This step exists
      # to catch drift between what Girsa produces and what Ksav asserts on, and
      # a pinned Ksav would be a drift check against a frozen consumer, which is
      # no drift check at all. The shared crates are pinned because taking a new
      # version has to be a deliberate act; this is the opposite question.
      - uses: actions/checkout@v4
        with:
          repository: SYKhayyat/ksav
          path: Ksav

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Girsa

      - run: cargo build --all-targets
        working-directory: Girsa

      # This used to be forty-three test functions quieter than it looked.
      #
      # They gated on the 3.4 GB corpus and `return`ed when it was absent, which
      # here is always — so CI printed `ok` in 0.00s for the acceptance tests of
      # W7, W8, W9, W10, W27, W28, W32, W43 and W44, and for the MCP surface
      # entire. `spec_counts.rs`, the file that would have caught §3's ids being
      # renumbered by every re-import, had not run since the day it was written.
      #
      # `girsa-fixture` builds a shelf from `merged.json` files and a
      # `links0.csv` through the real importer in about a second, and they all
      # run on it now. What genuinely needs the download — *697 simanim of 4,171
      # se'ifim*, the named mefarshim of a Sefaria release — is `#[ignore]`d
      # rather than skipped, so it reads as `10 ignored` here instead of ten
      # green ticks. On a machine with a corpus: `cargo test -- --ignored`.
      - run: cargo test
        working-directory: Girsa
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: Girsa
      - run: cargo fmt -- --check
        working-directory: Girsa

      # The producer against the consumer, on every push.
      #
      # `Ksav/ksav/engine/tests/from_girsa.rs` asserts a Ksav page against a
      # packet Girsa really produced. That fixture was captured by hand, because
      # reproducing it needed the 2.2 GB corpus — so when the import path
      # started dropping the printed edition, the fixture kept the old value and
      # the one test that existed to catch it went green for the whole time it
      # was broken. `--example fixture-packet` needs no corpus, so this is now a
      # `cargo run` and a `diff`. See tools/check-ksav-fixture.sh.
      - name: Girsa's packet is still the one Ksav asserts against
        run: bash tools/check-ksav-fixture.sh
        working-directory: Girsa

      # The other generated artifact, and it had no gate.
      #
      # The README says the shortcut card is "generated from the source, so it
      # cannot drift." It is generated; nothing checked that anybody had
      # re-generated it. Same script shape as the line above, for the same
      # reason — the repository invented generate-and-diff for the *other*
      # application's fixture and did not apply it to its own card.
      - name: The shortcut card is still what girsa-card prints
        run: bash tools/check-card.sh
        working-directory: Girsa

  # The window, which is where the whole Girsa half of the Ksav loop lives:
  # 5,018 lines and all 100 tauri commands.
  #
  # `app/src-tauri` cannot compile until the frontend has been built into
  # `app/dist`, and root `cargo build --all-targets` has to stay green without a
  # node toolchain. That constraint is real and it is now expressed as
  # `default-members` in the root manifest rather than as `exclude` — so the
  # shell is a workspace member that is simply not built by default, and it
  # inherits `[workspace.lints]` and `[workspace.dependencies]` like everything
  # else. What this job still owes is the *ordering*: build the frontend first,
  # then check the crate.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Girsa
      # What `tauri` links against on Linux. The webview is the platform's,
      # which is the reason spec.md asks for Hebrew-with-nikud to be looked at
      # on both platforms rather than screenshotted on one.
      #
      # `libappindicator3-dev` is deliberately absent. It and
      # `libayatana-appindicator3-dev` conflict — the ayatana package
      # `Replaces:` the old one, so asking for both makes apt exit 100 and the
      # job never reaches a compiler. Tauri v2 wants ayatana. Ksav's workflow
      # carries this same note, having learned it first; this file asked for
      # both anyway on its first run, and got the 100.
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Girsa/app/package-lock.json
      - run: npm ci
        working-directory: Girsa/app

      # The window's own tests, which ran when he remembered.
      #
      # `package.json` has defined `test` since the runner was written and no
      # gate has ever called it. Seven test files, and among them
      # `sources.test.mjs`, which the 31 July report called *"the entire
      # argument for that shape of test"* after it caught a raw `<select>` in
      # code written a week after the guard. It caught that because somebody ran
      # it by hand.
      #
      # This is GRADE finding N-3 — *"the gates were built and then never
      # switched on"* — recurring one layer down, three days after N-3 was
      # closed. Before `npm run build`, because a type error should not have to
      # wait behind a bundle.
      - run: npm test
        working-directory: Girsa/app

      # And the one check in this repository that has ever seen a pixel.
      #
      # `eyes.mjs` was written after two defects that no string search can
      # express — a mefaresh's comment drawn at `opacity: 0`, and a pane title
      # measured at 0px in a three-way split — and its own header said *"CI that
      # wants it enforced can set the variable."* No job ever set it, so on a
      # machine with no browser it printed one line and returned success: a check
      # that passes because it could not find its input, which is the exact shape
      # BUILDER.md forbids for tests by name.
      #
      # `EYES_REQUIRED` makes a missing browser a failure. The runner image ships
      # Chrome, which is not the engine the window runs on — WebView2 is — so
      # this is a second rendering engine's opinion rather than the same one
      # twice, which spec.md asks for anyway.
      - run: npm run eyes
        working-directory: Girsa/app
        env:
          EYES_REQUIRED: "1"

      # `app/dist`, which the crate below embeds and cannot compile without.
      - run: npm run build
        working-directory: Girsa/app

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # One workspace now, so one cache — the same key the library job saves
      # under. This job used to key on `Girsa/app/src-tauri` and rebuild
      # tantivy, candle and all nine crates a second time: 27m48s against the
      # library job's 2m44s on a cold cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Girsa

      # `check` rather than `build`: what this gate is for is the refactor in a
      # shared crate that breaks a caller nothing compiles. That shows up here.
      # Run from `app/src-tauri` so cargo selects the shell out of the workspace
      # — the root default members deliberately leave it out.
      - run: cargo check --all-targets
        working-directory: Girsa/app/src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: Girsa/app/src-tauri
      - run: cargo fmt -- --check
        working-directory: Girsa/app/src-tauri

  # The other operating system, which nothing had ever run on.
  #
  # `BUILDER.md` W9 carries a trap: *Tauri uses Edge's engine on Windows and
  # Safari's on macOS. Test Hebrew-with-nikud rendering on both — a screenshot
  # from one OS is not evidence.* Every measurement in this repository was taken
  # on Windows, and the record said so; what it could not say was whether the
  # code even **builds** for the other platform, because nothing had tried.
  #
  # This job is that, and it is deliberately not more than that. Read what it
  # does and does not settle:
  #
  # - it settles that the Rust half compiles and its tests pass on macOS — a
  #   different target, a different linker, a case-insensitive filesystem, and
  #   `std::path` behaving differently in all the places it does;
  # - it settles that the shell compiles against macOS's WebKit bindings, which
  #   is where a Tauri feature that only exists on one platform shows up;
  # - it settles **nothing at all about rendering.** The eyes tool drives
  #   Chrome, and the runner's Chrome on macOS is the same Blink it is on
  #   Windows. What W9 asks about is Safari's WebKit, which is what the shipped
  #   window actually uses there, and no headless WebKit is reachable here
  #   without a WebDriver stack this tool does not speak.
  #
  # So the row in `docs/not-yet.md` narrows and does not close: nikud rendering
  # on WebKit is still unknown, and *unknown* is the word rather than *fine*.
  # ── NixOS ───────────────────────────────────────────────────────────────────
  #
  # `flake.nix` claims Girsa builds on NixOS. It was written by reading the
  # Debian package list in this file and translating it, and for a while that
  # was the whole of the evidence — a claim about a platform nobody had run it
  # on, which is the kind of sentence `docs/not-yet.md` exists to hold.
  #
  # This job is the evidence. It runs **inside `nixos/nix`**, not on
  # `ubuntu-latest` with Nix bolted on, and the difference is the entire point:
  # Ubuntu has `/usr/lib`, so a build that quietly links against a system
  # library there succeeds and then fails on a machine that has no `/usr/lib` at
  # all. The container has no FHS, so anything the flake forgot to declare has
  # nowhere to come from.
  #
  # Two failures it is here to catch, both of which are what actually goes wrong
  # for a NixOS reader:
  #
  # 1. **`pkg-config` finding nothing.** Without the declared environment the
  #    first `cargo build` dies inside `webkit2gtk-sys` with a message about a
  #    `.pc` file, which reads as a Rust problem and is a packaging one.
  # 2. **npm's prebuilt binaries.** `esbuild` and `rollup` ship linked ELF
  #    executables with `/lib64/ld-linux-x86-64.so.2` as their interpreter, and
  #    that path does not exist on NixOS. `autoPatchelf` in the shellHook is the
  #    fix, and this is the job that proves it is needed and that it works.
  # **`container:` does not work here, and the reason is worth the four lines.**
  #
  # The obvious spelling of this job is `container: nixos/nix`, and it fails
  # before the first step: `exec /__e/node24/bin/node: no such file or
  # directory`. Every `uses:` action is a Node program, and the runner injects
  # **its own glibc Node** into whatever container it was given. `nixos/nix` is
  # Alpine, which is musl, so that binary cannot start — and neither can
  # `actions/checkout`.
  #
  # So the checkout happens on the host, where the runner's Node lives, and the
  # Nix half runs in the container by hand with the workspace mounted. What that
  # keeps is the only property this job is here for: **there is no `/usr/lib`
  # inside it.** Ubuntu has one, so a build there can quietly link against
  # something `flake.nix` never declared and pass, and then fail on a machine
  # that has none.
  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Girsa

      # One `docker run` for all of it: `nix develop` builds an environment, and
      # three separate containers would build it three times. `--rm` because the
      # only thing worth keeping is the exit code and the picture.
      #
      # **The script is a file, and that is the point.** It was written inline as
      # `sh -euc '...'` and the job died on the word `job's` in one of its
      # comments — the apostrophe closed the string, the last two commands ran on
      # the host, and the host has no Nix. What each line does and why is argued
      # in `tools/nixos-ci.sh`, where an apostrophe is an apostrophe.
      #
      # **`access-tokens`, because an unpinned flake asks GitHub who HEAD is.**
      # There is no `flake.lock` here on purpose — see `tools/nixos-ci.sh` — so
      # every run resolves `nixpkgs` and `flake-utils` through `api.github.com`.
      # Anonymously, that is sixty requests an hour shared by every job on the
      # runner's address, and this job spent two consecutive runs failing there:
      # a 504 and then a 403, neither of them about Nix. The run's own token
      # moves those fetches onto this repository's rate limit, where they are
      # one request each and nobody else is spending it.
      - name: The flake, entered, inside a machine with no FHS
        env:
          NIX_CONFIG: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD/Girsa:/w" -w /w \
            -e NIX_CONFIG \
            -e GIRSA_WINDOW_SHOT=/w/target/girsa-window.png \
            nixos/nix:latest \
            sh -eu /w/tools/nixos-ci.sh

      # The picture, whichever way it went — a run that failed on a blank screen
      # is a run whose screenshot is the finding. Written into `target/`, which
      # is inside the mount and is gitignored, because the container's own `/tmp`
      # goes with the container.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-window
          path: Girsa/target/girsa-window.png
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Girsa

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Girsa

      # The library half. No system libraries to install: what the Linux job
      # needs `libwebkit2gtk` for, macOS has in the OS.
      - run: cargo test
        working-directory: Girsa

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Girsa/app/package-lock.json
      - run: npm ci
        working-directory: Girsa/app
      # `app/dist`, which the shell embeds and cannot compile without.
      - run: npm run build
        working-directory: Girsa/app

      # The shell against macOS's own webview bindings. `check` rather than
      # `build`, for the reason the Linux job gives: what this catches is the
      # platform-conditional code that does not exist on the other one.
      - run: cargo check --all-targets
        working-directory: Girsa/app/src-tauri

  # An application somebody can obtain.
  #
  # `docs/the-second-sitting.md` finding 16: `target/release/bundle/` did not
  # exist, no installer had ever been produced, and every fact anybody in this
  # repository knew about how the window behaves had been learned from a
  # development server. `cargo build --release -p girsa-shell` succeeds and
  # produces a window that navigates to `http://localhost:5174` — which is why
  # `app/src-tauri/build.rs` now refuses that build rather than writing a
  # convincing executable with no application in it.
  #
  # This is the other half: the build that *is* real, run by a machine, with the
  # installers attached to the tag.
  #
  # Not on every push: a release build of tantivy and candle is tens of minutes
  # per platform, and the thing that has to be true on every push is that the
  # code compiles — which the three jobs above already say. What has to be true
  # on every *tag* is that a reader can download something, and that is this.
  #
  # ## Why this is a matrix and not a flag
  #
  # It ran only on `windows-latest`, and the reason given was that Windows is
  # where this ships first. That was true and it hid a second fact: **a Tauri
  # application cannot be built for one platform from another, at all.** The
  # window is the host's own webview — WebView2 here, WebKitGTK there,
  # WebKit.framework on macOS — and every installer is cut by a tool that runs
  # only on its own platform: WiX and NSIS on Windows, `hdiutil` for a `.dmg`,
  # `linuxdeploy` for an AppImage. So there was no cross-compile anybody had
  # declined to set up. There was simply nowhere a macOS or Linux build could
  # have come from, and none had ever existed.
  #
  # The `shell` and `macos` jobs above establish that the code *compiles* on
  # Linux and macOS. This establishes that it *bundles*, which is a different
  # claim on a different day: `cargo check` never runs a bundler, and a bundler
  # is where the icons, the licence file, the deep-link scheme registration and
  # the resource list are read for the first time.
  #
  # ## What it still does not establish
  #
  # That the window *looks right* on either. `docs/not-yet.md` says nikud
  # rendering on Safari's WebKit is unknown, and a green job here does not
  # narrow that by a millimetre — it produces a `.dmg` nobody has opened. Same
  # caution, one platform over, for WebKitGTK. Producing an artifact and having
  # looked at one are the two claims this repository exists to keep apart.
  bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      # A `.dmg` that fails to build is not a reason to throw away a Windows
      # installer that succeeded — and on a tag, that installer is the half of
      # this that has readers waiting for it.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-x86_64
            ext: .exe
            bundles: |-
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          # `macos-latest` is Apple Silicon, so this is an arm64 disk image and
          # it is named as one rather than as "macos". An Intel build is one
          # more row on an Intel runner; it is left out rather than guessed at,
          # because nobody here has the hardware to open the result on, and an
          # installer nobody has opened is the kind of thing this repository
          # writes down instead of shipping quietly.
          #
          # Unsigned, and therefore stopped by Gatekeeper on any Mac but the one
          # that built it. Signing needs a paid developer identity and
          # notarisation needs a round trip to Apple; neither exists here, and
          # saying so is better than a download that silently refuses to open.
          - os: macos-latest
            slug: macos-arm64
            ext: ""
            bundles: |-
              target/release/bundle/dmg/*.dmg
          # Linked against the runner's glibc, which is a floor on where these
          # will run: a distribution older than the runner image refuses them
          # with a loader error and no useful message. Worth stating, because
          # "the Linux build" reads as one artifact for all of Linux and is
          # really this one.
          - os: ubuntu-latest
            slug: linux-x86_64
            ext: ""
            bundles: |-
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The same list the `shell` job installs, for the same reason, including
      # why `libappindicator3-dev` is absent from it. Read that note before
      # adding anything here.
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The only build that embeds the frontend. `beforeBuildCommand` runs
      # `npm run build` — `tsc --noEmit && vite build` — into `app/dist`, and the
      # CLI turns on `custom-protocol`, which is the one bit that decides whether
      # the window serves itself or asks a dev server for a page.
      - run: npx tauri build
        working-directory: app

      # The tools a reader needs to *fill* the library, which the installer
      # deliberately does not carry.
      #
      # They are not Tauri `resources`: that list is validated when the shell
      # **compiles**, so declaring three release binaries there breaks
      # `cargo check` for anyone who has not built them first — CI's own shell
      # job included. A separate asset costs one download and couples nothing.
      - name: The corpus tools
        shell: bash
        run: |
          cargo build --release -p girsa-corpus --bin girsa-fetch --bin girsa-import
          cargo build --release -p girsa-search --bin girsa-index
          mkdir -p tools-out
          cp target/release/girsa-fetch${{ matrix.ext }} \
             target/release/girsa-import${{ matrix.ext }} \
             target/release/girsa-index${{ matrix.ext }} tools-out/
          cp README.md tools-out/

      - uses: actions/upload-artifact@v4
        with:
          name: girsa-${{ matrix.slug }}
          path: |
            ${{ matrix.bundles }}
            target/release/girsa-shell${{ matrix.ext }}
            tools-out/*
          if-no-files-found: error

      # And on a tag, where a reader can actually reach it.
      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # Three jobs now reach this line at once and two of them lose the
          # race to create the release. `|| true` is the loser's path — what
          # has to hold is that the release exists before anybody uploads, and
          # after this line it does, whichever job made it.
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true

          # `7z` is on the Windows runner and not the others; `tar` is on the
          # others and would produce something a Windows reader has to go
          # looking for a program to open. One archive per platform, named for
          # it, so three uploads never collide on one filename.
          if [ "$RUNNER_OS" = "Windows" ]; then
            tools="girsa-tools-${{ matrix.slug }}.zip"
            7z a "$tools" ./tools-out/*
          else
            tools="girsa-tools-${{ matrix.slug }}.tar.gz"
            tar -czf "$tools" -C tools-out .
          fi

          # Quoted on the way in so the newlines between the patterns survive,
          # unquoted on the way out so the shell splits them back into words
          # and expands each glob. The matrix holds one list, and it is the
          # same list the artifact upload above reads.
          bundles="${{ matrix.bundles }}"
          gh release upload "$GITHUB_REF_NAME" $bundles "$tools" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
