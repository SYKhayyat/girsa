[workspace]
resolver = "2"
members = [
    "crates/girsa-personal",
    "crates/girsa-corpus",
    "crates/girsa-search",
    "crates/girsa-link",
    "crates/girsa-fix",
    "crates/girsa-note",
    "crates/girsa-scan",
    "crates/girsa-lane",
    "crates/girsa-app",
    "crates/girsa-export",
    "crates/girsa-nearby",
    "crates/girsa-desk",
    "crates/girsa-mcp",
    "crates/girsa-fixture",
    "app/src-tauri",
]

# The Tauri shell is a member, and is not built by default.
#
# It used to be `exclude`d, for a reason that is real: it cannot compile until
# the frontend has been built into `app/dist`, and root `cargo build
# --all-targets` has to stay green on a machine with no node toolchain. But
# `exclude` was the wrong instrument for that constraint, and it cost more than
# it looks:
#
#   - `[workspace.lints]` cannot reach an excluded crate, so the shell
#     re-declared `unwrap_used`/`expect_used` by hand — and a *third* lint added
#     to the workspace would silently miss the 5,018 lines that own all the
#     interop.
#   - `[workspace.dependencies]` cannot reach it either, so eleven path
#     dependencies and the `=0.5.0` sefer-crates pins are spelled twice.
#   - Two lockfiles, two target directories, two caches: on a cold CI cache the
#     shell job took 27m48s against the library job's 2m44s, because it rebuilt
#     tantivy, candle and all nine crates a second time.
#
# `default-members` satisfies the constraint exactly. `cargo build`,
# `cargo test` and `cargo clippy` at the root select the default members, so
# `build.rs` never runs and `app/dist` is never needed; `cargo check` run from
# `app/src-tauri` still selects the shell, because cargo picks the package from
# the working directory. One workspace, one lockfile, one set of lints.
default-members = [
    "crates/girsa-personal",
    "crates/girsa-corpus",
    "crates/girsa-search",
    "crates/girsa-link",
    "crates/girsa-fix",
    "crates/girsa-note",
    "crates/girsa-scan",
    "crates/girsa-lane",
    "crates/girsa-app",
    "crates/girsa-export",
    "crates/girsa-nearby",
    "crates/girsa-desk",
    "crates/girsa-mcp",
    "crates/girsa-fixture",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/girsa"
authors = ["Shaul Khayyat"]

[workspace.dependencies]
# Your own layer's one file format. A leaf: it knows about jsonl and about
# nothing else in the tree, which is what lets `girsa-fix`, `girsa-note` and
# `girsa-link` share it without any of them depending on another.
girsa-personal = { version = "=0.1.0", path = "crates/girsa-personal" }
girsa-corpus = { version = "=0.1.0", path = "crates/girsa-corpus" }
girsa-search = { version = "=0.1.0", path = "crates/girsa-search" }
girsa-link = { version = "=0.1.0", path = "crates/girsa-link" }
girsa-fix = { version = "=0.1.0", path = "crates/girsa-fix" }
girsa-note = { version = "=0.1.0", path = "crates/girsa-note" }
girsa-scan = { version = "=0.1.0", path = "crates/girsa-scan" }
girsa-lane = { version = "=0.1.0", path = "crates/girsa-lane" }
girsa-app = { version = "=0.1.0", path = "crates/girsa-app" }
# The crates above girsa-app: each one is there because it carries a dependency
# the reading workspace has no use for, and `cargo test -p girsa-app` was
# building all of them to retest the taxonomy.
girsa-export = { version = "=0.1.0", path = "crates/girsa-export" }
girsa-nearby = { version = "=0.1.0", path = "crates/girsa-nearby" }
girsa-desk = { version = "=0.1.0", path = "crates/girsa-desk" }
girsa-mcp = { version = "=0.1.0", path = "crates/girsa-mcp" }
# Test scaffolding only, and a dev-dependency everywhere it is used — which is
# why the cycle back onto girsa-corpus is one cargo permits.
girsa-fixture = { version = "=0.1.0", path = "crates/girsa-fixture" }

# --- shared with Ksav, from the sefer-crates repository ---------------------
#
# Pinned to an EXACT version on purpose. sefer-crates is a separate repository,
# so a breaking change there is no longer one atomic commit that compile-checks
# both applications — which is the drift the shared-crate design exists to
# prevent. `=0.5.0` makes taking a new version a deliberate act on this side,
# and sefer-crates CI builds both dependents before a change can land there.
#
# `path` points at the sibling checkout so day-to-day work across all three
# repositories feels like one workspace without them being one. When these are
# published, the `path` key is what cargo ignores and `version` is what it uses;
# until then the checkout must be present.
girsa-source = { version = "=0.5.1", path = "../sefer-crates/crates/girsa-source" }
girsa-ref = { version = "=0.5.1", path = "../sefer-crates/crates/girsa-ref" }
girsa-hebrew = { version = "=0.5.1", path = "../sefer-crates/crates/girsa-hebrew" }
girsa-cite = { version = "=0.5.1", path = "../sefer-crates/crates/girsa-cite" }
girsa-ksav = { version = "=0.5.1", path = "../sefer-crates/crates/girsa-ksav" }
girsa-post = { version = "=0.5.1", path = "../sefer-crates/crates/girsa-post" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The dev profile is split on purpose. On the Windows/MSVC toolchain the build
# time of this workspace is dominated by `link.exe` and by the debug info it has
# to chew through — not by codegen. A flat `opt-level = 1` across the graph paid
# optimization cost on all 298 dependencies on a profile that also carried full
# debug info, and the result was ~1 GB of linker working set per test binary and
# a 50 GB target directory.
#
# The split follows what actually gets rebuilt: dependencies are compiled once
# and cached, so they can afford everything. The nine workspace crates are
# recompiled on every edit, so they pay for every setting here every time.
[profile.dev]
opt-level = 0
debug = "line-tables-only"   # backtraces keep file:line; the full PDB is what
                             # made the linker the bottleneck

# Built once, then cached forever — so optimize them properly. This is where the
# ingest and indexing throughput actually comes from: tantivy, tokenizers,
# candle, lopdf and zip are all on this side of the line, as are the path
# dependencies from sefer-crates (they are dependencies, not workspace members).
[profile.dev.package."*"]
opt-level = 3
debug = false

# ...except these two, which are ours and sit on the ingest/indexing hot path.
# This is the old `opt-level = 1` note, kept where it is genuinely needed instead
# of applied to the entire dependency graph.
[profile.dev.package.girsa-corpus]
opt-level = 2

[profile.dev.package.girsa-search]
opt-level = 2

# ...and these two, which are on the *reading* hot path: a reader's corrections
# are read and applied on every page turn. spec.md §7.5 budgets three seconds
# for correcting a typo, and `three_seconds.rs` was measuring an unoptimized
# build against it — at 16,000 corrections, 2.7 seconds of unoptimized string
# work in `Layer::apply` and `Open::corrected_by`, against a budget written
# about the application the reader actually runs. The guardrail was reporting
# the compiler's settings as the code's cost.
[profile.dev.package.girsa-fix]
opt-level = 2

[profile.dev.package.girsa-app]
opt-level = 2

[profile.release]
opt-level = 3
