[workspace]
resolver = "2"
members = [
    "crates/girsa-corpus",
    "crates/girsa-search",
    "crates/girsa-link",
    "crates/girsa-fix",
    "crates/girsa-note",
    "crates/girsa-scan",
    "crates/girsa-lane",
    "crates/girsa-app",
    "crates/girsa-mcp",
    "crates/girsa-fixture",
]
# The Tauri shell is its own cargo project, the way `tauri` expects and the way
# Ksav has it. It stays out of this workspace on purpose: it cannot build until
# the frontend has been built into `app/dist`, and `cargo build --all-targets`
# at the root is the check every work order has to keep green.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/girsa"
authors = ["Shaul Khayyat"]

[workspace.dependencies]
girsa-corpus = { version = "=0.1.0", path = "crates/girsa-corpus" }
girsa-search = { version = "=0.1.0", path = "crates/girsa-search" }
girsa-link = { version = "=0.1.0", path = "crates/girsa-link" }
girsa-fix = { version = "=0.1.0", path = "crates/girsa-fix" }
girsa-note = { version = "=0.1.0", path = "crates/girsa-note" }
girsa-scan = { version = "=0.1.0", path = "crates/girsa-scan" }
girsa-lane = { version = "=0.1.0", path = "crates/girsa-lane" }
girsa-app = { version = "=0.1.0", path = "crates/girsa-app" }
girsa-mcp = { version = "=0.1.0", path = "crates/girsa-mcp" }
# Test scaffolding only, and a dev-dependency everywhere it is used — which is
# why the cycle back onto girsa-corpus is one cargo permits.
girsa-fixture = { version = "=0.1.0", path = "crates/girsa-fixture" }

# --- shared with Ksav, from the sefer-crates repository ---------------------
#
# Pinned to an EXACT version on purpose. sefer-crates is a separate repository,
# so a breaking change there is no longer one atomic commit that compile-checks
# both applications — which is the drift the shared-crate design exists to
# prevent. `=0.5.0` makes taking a new version a deliberate act on this side,
# and sefer-crates CI builds both dependents before a change can land there.
#
# `path` points at the sibling checkout so day-to-day work across all three
# repositories feels like one workspace without them being one. When these are
# published, the `path` key is what cargo ignores and `version` is what it uses;
# until then the checkout must be present.
girsa-source = { version = "=0.5.0", path = "../sefer-crates/crates/girsa-source" }
girsa-ref = { version = "=0.5.0", path = "../sefer-crates/crates/girsa-ref" }
girsa-hebrew = { version = "=0.5.0", path = "../sefer-crates/crates/girsa-hebrew" }
girsa-cite = { version = "=0.5.0", path = "../sefer-crates/crates/girsa-cite" }
girsa-ksav = { version = "=0.5.0", path = "../sefer-crates/crates/girsa-ksav" }
girsa-post = { version = "=0.5.0", path = "../sefer-crates/crates/girsa-post" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The dev profile is split on purpose. On the Windows/MSVC toolchain the build
# time of this workspace is dominated by `link.exe` and by the debug info it has
# to chew through — not by codegen. A flat `opt-level = 1` across the graph paid
# optimization cost on all 298 dependencies on a profile that also carried full
# debug info, and the result was ~1 GB of linker working set per test binary and
# a 50 GB target directory.
#
# The split follows what actually gets rebuilt: dependencies are compiled once
# and cached, so they can afford everything. The nine workspace crates are
# recompiled on every edit, so they pay for every setting here every time.
[profile.dev]
opt-level = 0
debug = "line-tables-only"   # backtraces keep file:line; the full PDB is what
                             # made the linker the bottleneck

# Built once, then cached forever — so optimize them properly. This is where the
# ingest and indexing throughput actually comes from: tantivy, tokenizers,
# candle, lopdf and zip are all on this side of the line, as are the path
# dependencies from sefer-crates (they are dependencies, not workspace members).
[profile.dev.package."*"]
opt-level = 3
debug = false

# ...except these two, which are ours and sit on the ingest/indexing hot path.
# This is the old `opt-level = 1` note, kept where it is genuinely needed instead
# of applied to the entire dependency graph.
[profile.dev.package.girsa-corpus]
opt-level = 2

[profile.dev.package.girsa-search]
opt-level = 2

[profile.release]
opt-level = 3
